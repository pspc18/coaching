<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="blazerGirl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#002C54"/>
      <stop offset="100%" stop-color="#001833"/>
    </linearGradient>
    <clipPath id="circleClipGirl">
      <rect x="0" y="0" width="200" height="200" rx="8" ry="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circleClipGirl)">
    <!-- Soft Rose/Pink Background -->
    <rect width="200" height="200" fill="url(#bgGirl)"/>
    <circle cx="100" cy="78" r="58" fill="#ffffff" opacity="0.4"/>

    <!-- Back Long Hair / Ponytails -->
    <path d="M48 76 C40 105 42 136 54 152 C64 148 68 128 66 96 Z" fill="#1e293b"/>
    <path d="M152 76 C160 105 158 136 146 152 C136 148 132 128 134 96 Z" fill="#1e293b"/>
    <!-- Hair Ribbons -->
    <circle cx="53" cy="82" r="6" fill="#ec4899"/>
    <circle cx="147" cy="82" r="6" fill="#ec4899"/>

    <!-- Neck -->
    <rect x="86" y="114" width="28" height="28" rx="8" fill="#f1c27d"/>
    <path d="M86 124 Q100 134 114 124 L114 138 L86 138 Z" fill="#e0ac69" opacity="0.45"/>

    <!-- Shirt & School Blazer -->
    <path d="M36 200 C36 152 64 136 100 136 C136 136 164 152 164 200 Z" fill="url(#blazerGirl)"/>
    <!-- White Shirt V-Neck -->
    <polygon points="78,136 100,184 122,136" fill="#ffffff"/>
    <!-- Rounded Peter Pan Collar -->
    <path d="M76 135 Q84 154 100 150 Q78 158 68 142 Z" fill="#f8fafc"/>
    <path d="M124 135 Q116 154 100 150 Q122 158 132 142 Z" fill="#f8fafc"/>
    <!-- School Tie -->
    <polygon points="95,150 105,150 108,192 100,200 92,192" fill="#db2777"/>
    <polygon points="94,146 106,146 104,154 96,154" fill="#be185d"/>
    <!-- Blazer Lapels -->
    <polygon points="76,136 62,164 82,196 100,184" fill="#0f3460"/>
    <polygon points="124,136 138,164 118,196 100,184" fill="#0f3460"/>
    <!-- School Crest -->
    <rect x="122" y="168" width="16" height="18" rx="3" fill="#ec4899" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="130" cy="177" r="4" fill="#facc15"/>

    <!-- Ears -->
    <circle cx="59" cy="85" r="8" fill="#f1c27d"/>
    <circle cx="141" cy="85" r="8" fill="#f1c27d"/>
    <!-- Small Stud Earrings -->
    <circle cx="59" cy="90" r="2" fill="#facc15"/>
    <circle cx="141" cy="90" r="2" fill="#facc15"/>

    <!-- Face -->
    <rect x="62" y="42" width="76" height="79" rx="38" fill="#ffdbac"/>

    <!-- Girl Front Hair & Side Swept Bangs -->
    <path d="M58 80 C55 44 75 26 100 26 C125 26 145 44 142 80 C138 60 124 48 102 46 C84 46 68 58 58 80 Z" fill="#1e293b"/>
    <path d="M62 66 Q82 46 108 46 Q128 48 138 66 Q120 52 98 52 Q76 52 62 66 Z" fill="#334155"/>

    <!-- Eyebrows -->
    <path d="M75 71 Q83 66 91 71" stroke="#1e293b" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M109 71 Q117 66 125 71" stroke="#1e293b" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- Eyes with Eyelashes -->
    <circle cx="83" cy="82" r="4.8" fill="#0f172a"/>
    <circle cx="117" cy="82" r="4.8" fill="#0f172a"/>
    <path d="M77 79 L74 76" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M123 79 L126 76" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="84.5" cy="80.5" r="1.6" fill="#ffffff"/>
    <circle cx="118.5" cy="80.5" r="1.6" fill="#ffffff"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="73" cy="93" rx="6.5" ry="3.8" fill="#f43f5e" opacity="0.35"/>
    <ellipse cx="127" cy="93" rx="6.5" ry="3.8" fill="#f43f5e" opacity="0.35"/>

    <!-- Nose -->
    <path d="M100 82 L98.5 91 L102.5 92" stroke="#d99b66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Warm Smile -->
    <path d="M88 101 Q100 111 112 101" stroke="#e11d48" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>

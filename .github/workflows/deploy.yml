name: Deploy to VPS Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting Deployment on VPS..."
            git config --global --add safe.directory '*' || true
            git config --global --add safe.directory /var/www/coaching.rusoft.online/public || true
            cd /var/www/coaching.rusoft.online/public

            echo "📥 Fetching and syncing latest master branch..."
            git fetch origin master
            git reset --hard origin/master
            git pull origin master

            echo "🧹 Purging all Laravel caches..."
            php artisan optimize:clear || true
            php artisan view:clear || true
            php artisan config:clear || true
            php artisan route:clear || true
            php artisan cache:clear || true
            php artisan clear-compiled || true

            echo "⚡ Re-optimizing Laravel caches..."
            php artisan optimize || true

            echo "⚡ Reloading PHP-FPM / OPcache & Web Server..."
            sudo systemctl reload php*-fpm || systemctl reload php*-fpm || service php*-fpm reload || true
            sudo systemctl reload nginx || systemctl reload apache2 || service nginx reload || service apache2 reload || true

            echo "✅ Deployment completed successfully!"